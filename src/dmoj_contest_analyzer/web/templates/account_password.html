{% extends "base.html" %}
{% block title %}Cambiar contraseña{% endblock %}
{% block content %}
<h1>Cambiar contraseña</h1>
<p>Debes establecer una contraseña nueva para continuar.</p>
<form method="post" action="/account/password">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Contraseña actual
    <input type="password" name="old_password" autocomplete="current-password" required></label>
  <label>Contraseña nueva
    <input type="password" name="new_password" autocomplete="new-password" required></label>
  <label>Repite la contraseña nueva
    <input type="password" name="new_password2" autocomplete="new-password" required></label>
  <button type="submit">Guardar</button>
</form>
{% endblock %}

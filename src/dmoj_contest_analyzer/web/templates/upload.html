{% extends "base.html" %}
{% block title %}Subir export{% endblock %}
{% block head %}<script src="/static/app.js" defer></script>{% endblock %}
{% block content %}
<h1>Subir export de concurso</h1>
<form method="post" action="/jobs" enctype="multipart/form-data">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Archivo .zip del export
    <input type="file" name="archivo" accept=".zip" required></label>
  <label>Juez con IA (opcional)
    <select name="model_ref" id="model_ref" data-models-url="/api/models">
      <option value="none">(ninguno — solo timing/estilo/JPlag)</option>
    </select>
  </label>
  <label><input type="checkbox" name="run_jplag" value="true"> Ejecutar JPlag</label>
  <label><input type="checkbox" name="jplag_solo_ac" value="true">
    JPlag solo con envíos AC</label>
  <button type="submit">Analizar</button>
</form>
{% endblock %}

# CI override: `docker compose -f compose.yaml -f compose.ci.yaml up`.
# Uses a named volume for /data (inherits image perms, no host chown needed) and
# a baked config file so there is no host bind mount to prepare.
services:
  analyzer:
    # CI builds and `docker load`s this tag first, then `compose up --no-build`
    # runs it -- no rebuild, so the smoke test exercises the real image.
    image: dmoj-analyzer:ci
    volumes:
      - data:/data
      - ./backends.example.toml:/config/backends.toml:ro
    environment:
      APP_SECRET_KEY: ${APP_SECRET_KEY:?set it}

volumes:
  data: {}

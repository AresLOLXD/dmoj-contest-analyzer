[project]
name = "dmoj-contest-analyzer"
version = "0.1.0"
description = "Detecta patrones de envío sospechosos (IA/plagio) en exports de concursos DMOJ y corre JPlag, todo en un reporte Excel."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ares Ulises Juárez Martínez", email = "aresulises8@hotmail.com" }]
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
web = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "itsdangerous>=2.0",
    "python-multipart>=0.0.9",
    "pydantic-settings",
    "argon2-cffi",
    "httpx>=0.27",
]

[project.scripts]
dmoj-contest-analyzer = "dmoj_contest_analyzer.cli:main"
dmoj-manage-users = "dmoj_contest_analyzer.users_cli:main"

[project.urls]
Repository = "https://github.com/AresLOLXD/dmoj-contest-analyzer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dmoj_contest_analyzer"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "respx>=0.21", "pytest-asyncio>=0.23"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
